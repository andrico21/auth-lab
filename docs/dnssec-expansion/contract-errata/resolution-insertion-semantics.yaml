kind: dnssec-resolution-errata-insertion-semantics
schemaVersion: 1
applies_to: local://dnssec-resolution-errata-proposal.yaml
status: supplement-proposal-only
purpose: >-
  Record the exact original/final array order for every array insertion in the
  errata proposal and supersede the main artifact's sentence that interpreted
  expect_absent as an absent original index.
semantics:
  - The main proposal's op=add indices are sequential insertion positions after all preceding operations in the same finding.
  - expect_absent true means the exact inserted value is not already present; it is not an assertion that the original index was absent.
  - Every element not named as inserted keeps its original identity, bytes and relative order.
  - value_ref same-as:<pointer> copies the exact value added at that pointer; no unbound data.
  - op=add to /- appends; op=replace/remove with expect or expect_selector is evaluated against the original object.
