        value:
          id: lab-dnssec03:signed-child:parent-ds:r:raw
          actorId: dnsResolver
          kind: network-receive
          hopRef: lab-dnssec03:signed-child:parent-ds
          action: Receive public records untrusted; response receipt is not local DNSSEC verification.
      - op: add
        path: /lessons/1/cases/0/sequence/4
        expect_absent: true
        value:
