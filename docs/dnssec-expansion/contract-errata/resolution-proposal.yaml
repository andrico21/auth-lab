sources:
  rfc4035:
    title: DNS Security Extensions
    url: https://www.rfc-editor.org/rfc/rfc4035.html
    capture: docs/dnssec-expansion/sources/resolution/s06-rfc4035-text.txt
    sha256: 8978b120636c69b2080b12768266ec48cd4c0879583310863a62f7c409908084
    sections:
      "3.1.4": >-
        A security-aware authoritative name server returning a referral includes
        the DS RRset and RRSIG when present, or the NSEC RR and RRSIG proving no
        DS when absent.
      "3.1.4.1": >-
        The DS RRset for a delegation is stored in the parent zone; a
        security-aware resolver sends queries to the parent zone when looking
        for a needed DS RR.
      "4.2": >-
        When attempting to retrieve a missing DS, a security-aware
        iterative-mode resolver MUST query the name servers for the parent zone,
        not the child zone. When retrieving missing parental-side NSEC RRs at a
        zone cut, it MUST query the parent zone, not the child zone.
      "4.3": >-
        Indeterminate is the state where the resolver cannot obtain the
        necessary DNSSEC RRs; Bogus is the state where it ought to establish a
        chain but cannot.
      "5.1": >-
        An island of security requires an independently obtained initial
        authenticated zone key; all normal validation processes still apply.
      "5.2": >-
        Given a DS RR, the child apex DNSKEY RRset is authenticated only if the
        DS is authenticated by a parent DNSKEY, the DS matches a child DNSKEY,
        the matching DNSKEY has the Zone flag set and signs the child apex
        DNSKEY RRset. A resolver MUST use the parent NSEC RR when proving that a
        DS RRset does not exist.
      "5.3.1": >-
        An RRSIG can authenticate an RRset only if owner/class, signer, type
        covered, labels, inception/expiration and matching DNSKEY conditions
        hold.
      "5.3.3": >-
        An authenticated RRset TTL is no greater than the minimum of the
        received RRset TTL, received RRSIG TTL, RRSIG Original TTL and the
        difference between signature expiration and current time.
  rfc4034:
    title: Resource Records for the DNS Security Extensions
    url: https://www.rfc-editor.org/rfc/rfc4034.html
    capture: docs/dnssec-expansion/sources/resolution/s05-rfc4034-text.txt
    sha256: 6c32963b76808ec4e5f1282b5e13c5216df4670d21e1590bf29af4066f49b355
    sections:
      "2.1": DNSKEY/RRSIG/DS/NSEC RDATA fields and key tag calculation.
      "3.1": RRSIG covers exactly one RRset; signer, labels, Original TTL and signature fields are signed.
  rfc1034:
    title: Domain Names - Concepts and Facilities
    url: https://www.rfc-editor.org/rfc/rfc1034.html
    capture: docs/dnssec-expansion/sources/resolution/s22-rfc1034-text.txt
    sha256: d6b10a71441df879cc2817d23f2dad120c8a5f87e74eba1e4ed4b743a76a891a
    sections:
      "4.3.2": >-
        The ideal answer is from a server authoritative for the query; a
        non-authoritative server returns a referral closer to the answer.
      "6.2.7": >-
        A.ISI.EDU is authoritative for both the ARPA domain and the ISI.EDU
        domain; the AA bit guarantees authority only for data matching QNAME.
  rfc1035:
    title: Domain Names - Implementation and Specification
    url: https://www.rfc-editor.org/rfc/rfc1035.html
    capture: docs/dnssec-expansion/sources/resolution/s22-rfc1035-text.txt
    sha256: d14ae809fc9b41bbcae26bb38c937c9515808b944f3252b00de9fe0e95f4fdfb
    sections:
      "4.1.1": >-
        AA is valid in responses and specifies that the responding name server
        is an authority for the domain name in the question section.
      "3.4.1": A RDATA ADDRESS is a 32-bit Internet address.
  rfc9499:
    title: DNS Terminology
    url: https://www.rfc-editor.org/rfc/rfc9499.html
    capture: docs/dnssec-expansion/sources/resolution/s04-rfc9499-text.txt
    sha256: 270b62df854911dddd246f6c081952106897983a5e02dfe8b3819d72843d9ab1
    sections:
      "6": Validation, trust anchor and trust store roles.
      "9-11": Resolver, cache and security-state terminology; earlier definitions remain distinct.
  rfc6840:
    title: Clarifications and Implementation Notes for DNSSEC
    url: https://www.rfc-editor.org/rfc/rfc6840.html
    capture: docs/dnssec-expansion/sources/resolution/s03-rfc6840-text.txt
    sha256: 32c2a8c755f37f3467b4ca098fc0283efe53d2648e93c3ae966cfa390a50bfaf
    sections:
      "5.9": CD handling, upstream failure context and cached BAD data.
  rfc8198:
    title: Aggressive Use of DNSSEC-Validated Cache
    url: https://www.rfc-editor.org/rfc/rfc8198.html
    capture: docs/dnssec-expansion/sources/resolution/s10-rfc8198-text.txt
    sha256: 78b49d40dc78dffb30fd1aad7313c21800ff9642ab60c27b1a507d2662bec80a
    sections:
      "5.1-5.3": NSEC/NSEC3/wildcard synthesis requires sufficient validated cache evidence.
      "5.4": Negative TTL is bounded by SOA.MINIMUM and SOA TTL; NSEC/NSEC3 TTL may be reduced.
  rfc9520:
    title: Negative Caching of DNS Resolution Failures
    url: https://www.rfc-editor.org/rfc/rfc9520.html
    capture: docs/dnssec-expansion/sources/resolution/s12-rfc9520-text.txt
    sha256: 424b5e297db737b7cc7f21d37d30dca211f3f237264c3c6ef3d17653a4e1c531
    sections:
      "3": Bounded resolution-failure caching.
  rfc4592:
    title: The Role of Wildcards in the Domain Name System
    url: https://www.rfc-editor.org/rfc/rfc4592.html
    capture: docs/dnssec-expansion/sources/resolution/s26-rfc4592-text.txt
    sha256: 69bf6d3d435324a24747807106b5b4050c1f15e9f9fb8e0b67f3ab13d22f98bc
    sections:
      "2.2": Wildcard owner/type semantics and synthesis.
      "3.3": Wildcard matching and closest encloser.
  rfc6672:
    title: DNAME Redirection in the DNS
    url: https://www.rfc-editor.org/rfc/rfc6672.html
    capture: docs/dnssec-expansion/sources/resolution/s26-rfc6672-text.txt
    sha256: 50cbe190ac838ca006a4642a818c101aaeca623f36fe33e979d1afc92fa11799
    sections:
      "3.1": DNAME substitution and synthesized CNAME.
      "5.3": DNAME and DNSSEC behavior.
  erratum5226:
    title: RFC4035 erratum 5226
    url: https://errata.rfc-editor.org/eid5226/
    capture: docs/dnssec-expansion/sources/resolution/s28-eid5226.html
    sha256: 1b9371fac01d50415828161f24407a147a1f168b05b757861822b78e625e25a4
    status: Verified
    type: Technical
    correction: >-
      The special DS response condition applies when the server is not
      authoritative for ANY zone above the child apex, not only the immediate
      parent.
authored_profile:
  worker-plan:
    path: docs/dnssec-expansion/inputs/worker-plan.html
    sha256: e50d93f4072270ea3522aaeb0ae81c8012adbb515d19c7bcae52136ea6cc9994
    relevant: >-
      Root, parent and child authorities label zone ownership and delegation
      cuts. A server can serve several zones without merging their signing
      authority. Distinguish authoritative answers from recursive service.
      Do not invent a network hop between local components.
  scenario-manifest:
    path: docs/dnssec-expansion/scenario-manifest.json
    sha256: null
    relevant: DNS03 acceptance requires parent-authenticated DS, matching child key and child DNSKEY RRset acceptance; DNS09 acceptance requires each relevant zone to use its own DS/DNSKEY/proof path.
