  - id: CLOCK-SIG-01
    cases: [DNS03/supported-ds-mismatch, DNS22/stale-private-anchor]
    priority: 2
    confidence: 0.9
    production_consulted: false
    worksheet_sha256: b013da69b7a532fc62f074f91f215d1fae9dcf8251f3c01d29894239cb0cdac5
    freeze_sha256: b8ee8034a613e70c78a1f007b30a7d20b9d18e80ea84f9472bd2117e6044ad19
    rationale: >-
      Both cases bind an RRSIG whose expiration is 1803081600 but declare the
      clock expiration 1792717200 and a signatureRemaining of 3600. At receipt
      1792713600 the signed signature has 10368000 seconds remaining. The
      effective cache TTL is 300 from the RRset, so the bogus verdicts remain,
      but the time dependency is not faithful to the signed evidence.
    policy:
      before: Clock expiration and signatureRemaining describe the baseline 1792717200 leaf, not the bound 1803081600 RRSIG.
      after: Clock/signature bounds match the bound RRSIG; signatureRemaining is 10368000.
    sources: [rfc4035]
    patches:
      - op: replace
        path: /lessons/1/cases/2/setup/clock/expiration
        expect: 1792717200
        value: 1803081600
      - op: replace
        path: /lessons/1/cases/2/timeDependencies/clock/expiration
        expect: 1792717200
        value: 1803081600
      - op: replace
        path: /lessons/1/cases/2/timeDependencies/ttlBoundSeconds/signatureRemaining
        expect: 3600
        value: 10368000
      - op: replace
        path: /lessons/12/cases/4/setup/clock/expiration
        expect: 1792717200
        value: 1803081600
      - op: replace
        path: /lessons/12/cases/4/timeDependencies/clock/expiration
        expect: 1792717200
        value: 1803081600
      - op: replace
        path: /lessons/12/cases/4/timeDependencies/ttlBoundSeconds/signatureRemaining
        expect: 3600
        value: 10368000
