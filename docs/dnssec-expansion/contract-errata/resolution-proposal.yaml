findings:
  - id: DNS03-SC-01
    cases: [DNS03/signed-child]
    priority: 1
    confidence: 0.97
    production_consulted: false
    worksheet_sha256: b013da69b7a532fc62f074f91f215d1fae9dcf8251f3c01d29894239cb0cdac5
    freeze_sha256: b8ee8034a613e70c78a1f007b30a7d20b9d18e80ea84f9472bd2117e6044ad19
    rationale: >-
      The case's initial cache explicitly denies both the parent DS and the
      child DNSKEY, and the only content hop is the child A query. The secure
      outcome and the parent-to-child-authentication checkpoint therefore use
      evidence that is never received. The parentDsCatalog is catalog-only by
      the case's own rrsetCatalogScope, and numericBindings.chain is a binding,
      not a receipt.
    policy:
      before: Secure/AD=1 after two hops despite no parent DS or child DNSKEY receipt, with both cache flags false.
      after: Secure/AD=1 only after a parent DS response and a child DNSKEY response are received; both receipts appear in the hop/sequence transcript before the authentication checkpoint.
    sources: [rfc4035, rfc4034]
    patches:
      - op: add
        path: /lessons/1/cases/0/outcome/flags/hops/0
        expect_absent: true
        value:
          id: lab-dnssec03:signed-child:parent-ds
          from: dnsResolver
          to: dnsParent
          transport: UDP
          question: {qname: lab.example., qtype: DS, qclass: IN, qdcount: 1}
          query:
            id: lab-dnssec03:signed-child:parent-ds:q
            flags: {QR: 0, AA: 0, TC: 0, RD: 0, RA: 0, AD: 0, CD: 1, DO: 1, CO: 0, opcode: 0, Z: 0}
            edns: {present: true, version: 0, udpPayloadSize: 1232}
            messageId: 16642
          response:
            id: lab-dnssec03:signed-child:parent-ds:r
            inReplyTo: lab-dnssec03:signed-child:parent-ds:q
            flags: {QR: 1, AA: 1, TC: 0, RD: 0, RA: 0, AD: 0, CD: 0, DO: 1, CO: 0, opcode: 0, Z: 0}
            rcode: NOERROR
            edns: {present: true, version: 0, udpPayloadSize: 1232}
            messageId: 16642
          evidenceRefs: [lab-dnssec03:signed-child:numericBindings-chain-3:example-child-ds]
      - op: add
        path: /lessons/1/cases/0/outcome/flags/hops/1
        expect_absent: true
        value:
          id: lab-dnssec03:signed-child:child-key
          from: dnsResolver
          to: dnsChild
          transport: UDP
          question: {qname: lab.example., qtype: DNSKEY, qclass: IN, qdcount: 1}
          query:
            id: lab-dnssec03:signed-child:child-key:q
            flags: {QR: 0, AA: 0, TC: 0, RD: 0, RA: 0, AD: 0, CD: 1, DO: 1, CO: 0, opcode: 0, Z: 0}
            edns: {present: true, version: 0, udpPayloadSize: 1232}
            messageId: 16643
          response:
            id: lab-dnssec03:signed-child:child-key:r
            inReplyTo: lab-dnssec03:signed-child:child-key:q
            flags: {QR: 1, AA: 1, TC: 0, RD: 0, RA: 0, AD: 0, CD: 0, DO: 1, CO: 0, opcode: 0, Z: 0}
            rcode: NOERROR
            edns: {present: true, version: 0, udpPayloadSize: 1232}
            messageId: 16643
          evidenceRefs: [lab-dnssec03:signed-child:numericBindings-chain-4:child-dnskey-g1]
      - op: add
        path: /lessons/1/cases/0/checkpoints/5/expected/response/hops/0
        expect_absent: true
        value_ref: same-as:/lessons/1/cases/0/outcome/flags/hops/0
      - op: add
        path: /lessons/1/cases/0/checkpoints/5/expected/response/hops/1
        expect_absent: true
        value_ref: same-as:/lessons/1/cases/0/outcome/flags/hops/1
      - op: add
