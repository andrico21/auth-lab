  - id: DNS09-XZONE-01
    cases: [DNS09/cname-secure-target, DNS09/cname-insecure-target, DNS09/cname-bogus-target, DNS09/dname-synthesized-cname]
    priority: 2
    confidence: 0.82
    production_consulted: false
    worksheet_sha256: b013da69b7a532fc62f074f91f215d1fae9dcf8251f3c01d29894239cb0cdac5
    freeze_sha256: b8ee8034a613e70c78a1f007b30a7d20b9d18e80ea84f9472bd2117e6044ad19
    rationale: >-
      The alias cases require the signed/unsigned other.example target but
      omit it from setup.zones and never declare which authority serves it.
      The authored plan allows one server to serve several zones without
      merging signing authority, and RFC1034 section 6.2.7 gives the
      multi-zone authoritative example. The minimal resolution is to declare
      dnsParent as serving both example. and other.example., with separate
      signing authority, and to attach the target evidence to the existing or
      added target hop.
    policy:
      before: other.example. target zone/authority is implicit; the only target hop is authoritative from dnsParent with no zone declaration.
      after: other.example. is declared in zones; dnsParent is explicitly a multi-zone authority with separate signing authority; target hops carry the exact target evidence refs.
    sources: [rfc1034, rfc1035, rfc4035, erratum5226]
    patches:
      - op: replace
        path: /lessons/7/cases/3/setup/zones
        expect: [., example., lab.example.]
        value: [., example., lab.example., other.example.]
      - op: add
        path: /lessons/7/cases/3/setup/route/authorities
        expect_absent: true
        value: {dnsParent: {servesZones: [example., other.example.], signingAuthoritySeparate: true}}
