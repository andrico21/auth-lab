name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build standalone bundle
        run: bun run build
      - name: Verify the committed dist bundle is current
        run: git diff --exit-code -- dist/
      - name: Run the test suite
        run: bun run test
