name: CI

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish Pages after all CI checks (main only)
        type: boolean
        required: true
        default: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Set up pinned offline DNSSEC prerequisites
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.10
          enable-cache: false
          python-version: 3.14.4
      - name: Acquire pinned Python prerequisite
        run: uv python install 3.14.4
      - name: Verify DNSSEC public fixture projections
        run: |
          bun tools/verification/build-dnssec-public-addendum.mjs --check
          bun tools/verification/build-dnssec-public-completion.mjs --check
          bun tools/verification/build-dnssec-public-review-corrections.mjs --check
          bun tools/verification/build-dnssec-signature-fingerprints.mjs --check
      - name: Build standalone bundle
        run: bun run build --source-version
      - name: Verify the committed dist bundle is current
        run: git diff --exit-code -- dist/
      - name: Smoke-test emitted standalone boot and catalog
        run: AUTH_LAB_QA_EVIDENCE_DIR="$RUNNER_TEMP/auth-lab-compiled-smoke" bun tools/verification/compiled-bundle-smoke.mjs
      - name: Verify DNSSEC sealed numeric references
        run: bun tools/verification/check-dnssec-numeric.mjs --out "$RUNNER_TEMP/auth-lab-dnssec-numeric"
      - name: Verify committed current DNSSEC seal
        run: uv run --offline --no-project --python 3.14.4 python tools/verification/dnssec-crypto-current/replay.py --check docs/dnssec-expansion/numeric/runtime-50.0.0/reference
      - name: Replay and seal current DNSSEC references offline
        run: bun run verify:dnssec --out "$RUNNER_TEMP/auth-lab-dnssec-current"
      - name: Install isolated cryptographic verification dependencies
        run: bun install --cwd tools/verification/expansion-crypto --frozen-lockfile --ignore-scripts
      - name: Verify pinned full cryptographic vectors
        run: bun run verify:crypto
      - name: Run the test suite
        run: bun run test
      - name: Build standalone with the release tag
        if: github.ref_type == 'tag'
        env:
          AUTH_FLOW_STUDIO_VERSION: ${{ github.ref_name }}
        run: bun run build
      - name: Upload the tested tagged standalone
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: auth-flow-studio-tagged
          path: dist/auth-flow-studio.html
          if-no-files-found: error
      - name: Stage the verified standalone bundle
        if: >-
          github.repository == 'andrico21/auth-lab' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_pages))
        run: |
          mkdir -p _site
          cp dist/auth-flow-studio.html _site/index.html
      - name: Upload verified Pages artifact
        if: >-
          github.repository == 'andrico21/auth-lab' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_pages))
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site

  deploy:
    needs: test
    if: >-
      needs.test.result == 'success' &&
      github.repository == 'andrico21/auth-lab' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_pages))
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy verified CI artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
